<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tracing Screen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f2f2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#f2f2f7;touch-action:none;overscroll-behavior:none}#photo{max-width:none;max-height:none;display:none;transform-origin:center;pointer-events:none;-webkit-user-drag:none}#hint{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#555;font-size:20px;pointer-events:none}.bar-wrap{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:20;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 12px;touch-action:pan-x;overscroll-behavior-x:contain}.bar-wrap::-webkit-scrollbar{display:none}.bar{width:max-content;min-width:100%;display:flex;justify-content:flex-start;gap:8px;padding:8px;background:rgba(249,249,249,.82);border:1px solid rgba(60,60,67,.18);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.14);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}button,.upload{border:0;border-radius:15px;padding:12px 15px;background:rgba(118,118,128,.12);color:#007aff;font:600 15px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.upload input{display:none}button:active,.upload:active{transform:scale(.96);background:rgba(118,118,128,.22)}#lock.locked{background:rgba(255,149,0,.18);color:#ff9500}.locked-ui .bar>*:not(#lock){display:none}.locked-ui .bar{min-width:0}.locked-ui .bar-wrap{display:flex;justify-content:center;overflow:visible}.progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:rgba(28,28,30,.88);color:#fff;padding:10px 16px;border-radius:14px;display:none;pointer-events:none}
</style></head><body>
<div id="stage"><img id="photo" alt="Фото"><div id="hint">Натисніть «➕ Фото»<br>Потім збільшуйте та пересувайте двома пальцями</div></div>
<div class="progress" id="progress">Тримайте 10 с</div>
<div class="bar-wrap" id="menuScroll"><div class="bar" id="bar">
<label class="upload">➕ Фото<input id="file" type="file" accept="image/*"></label>
<button type="button" id="darker">🌙 Темніше</button><button type="button" id="lighter">☀️ Світліше</button>
<button type="button" id="fullscreen">⛶ Повний екран</button><button type="button" id="exitFullscreen" hidden>✕ Вийти</button>
<button type="button" id="lock">🔒 Блокувати</button>
</div></div>
<script>
const $=s=>document.querySelector(s);const stage=$('#stage'),img=$('#photo'),file=$('#file'),hint=$('#hint'),lock=$('#lock'),progress=$('#progress'),fullscreenBtn=$('#fullscreen'),exitFullscreenBtn=$('#exitFullscreen'),menuScroll=$('#menuScroll');
let bright=1,scale=1,x=0,y=0,locked=false,startDist=0,startScale=1,startX=0,startY=0,startMid=null,holdTimer=null,holdStart=0;
function draw(){img.style.filter=`brightness(${bright})`;img.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
file.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);img.onload=()=>{img.style.display='block';hint.style.display='none';scale=1;x=0;y=0;bright=1;draw()};img.src=url});
$('#lighter').addEventListener('click',e=>{e.stopPropagation();bright=Math.min(2,bright+.15);draw()});
$('#darker').addEventListener('click',e=>{e.stopPropagation();bright=Math.max(.25,bright-.15);draw()});
function fsActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function updateFullscreenUI(){const a=fsActive();fullscreenBtn.hidden=a;exitFullscreenBtn.hidden=!a}
fullscreenBtn.addEventListener('click',async()=>{try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();}catch(err){alert('На iPhone Safari повний екран може бути недоступний. Додайте сайт на Домашній екран для режиму застосунку.')}updateFullscreenUI()});
exitFullscreenBtn.addEventListener('click',async()=>{try{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}catch(err){}updateFullscreenUI()});
document.addEventListener('fullscreenchange',updateFullscreenUI);document.addEventListener('webkitfullscreenchange',updateFullscreenUI);
function setLocked(v){locked=v;document.body.classList.toggle('locked-ui',v);lock.classList.toggle('locked',v);lock.textContent=v?'🔒 Утримуйте 10 с':'🔒 Блокувати';progress.style.display='none';if(!v)menuScroll.scrollTo({left:0,behavior:'smooth'})}
lock.addEventListener('click',()=>{if(!locked)setLocked(true)});
function beginHold(e){if(!locked)return;e.preventDefault();holdStart=performance.now();progress.style.display='block';const tick=now=>{const left=Math.max(0,10-(now-holdStart)/1000);progress.textContent=`Тримайте ${left.toFixed(1)} с`;if(left<=0){holdTimer=null;setLocked(false);return}holdTimer=requestAnimationFrame(tick)};holdTimer=requestAnimationFrame(tick)}
function endHold(){if(holdTimer)cancelAnimationFrame(holdTimer);holdTimer=null;if(locked)progress.style.display='none'}
['pointerdown','touchstart'].forEach(ev=>lock.addEventListener(ev,beginHold,{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(ev=>lock.addEventListener(ev,endHold,{passive:false}));
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function mid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
stage.addEventListener('touchstart',e=>{if(locked){e.preventDefault();return}if(e.touches.length===2){startDist=dist(e.touches[0],e.touches[1]);startScale=scale;startMid=mid(e.touches[0],e.touches[1]);startX=x;startY=y}},{passive:false});
stage.addEventListener('touchmove',e=>{e.preventDefault();if(locked)return;if(e.touches.length===2&&startMid){const m=mid(e.touches[0],e.touches[1]);scale=Math.max(.2,Math.min(8,startScale*dist(e.touches[0],e.touches[1])/Math.max(startDist,1)));x=startX+(m.x-startMid.x);y=startY+(m.y-startMid.y);draw()}},{passive:false});
stage.addEventListener('touchend',e=>{if(e.touches.length<2)startMid=null},{passive:false});
// Не перехоплюємо горизонтальні жести на панелі: вона вільно свайпається вправо/вліво.
menuScroll.addEventListener('touchmove',e=>e.stopPropagation(),{passive:true});
// Сам екран/сторінка нерухомі: прокручується тільки нижнє меню.
document.addEventListener('touchmove',e=>{if(!menuScroll.contains(e.target))e.preventDefault()},{passive:false});
window.addEventListener('scroll',()=>window.scrollTo(0,0));
updateFullscreenUI();
</script></body></html>
