<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tracing Screen</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}#stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#fff}#photo{max-width:none;max-height:none;display:none;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}.bar{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;z-index:20;padding:10px;background:#000b;border-radius:18px;backdrop-filter:blur(10px)}button,.upload{border:0;border-radius:14px;padding:13px 16px;background:#fff;color:#111;font-size:16px;font-weight:700;white-space:nowrap}.upload input{display:none}#lock.locked{background:#ffdf66}.locked-ui .bar>*:not(#lock){display:none}#hint{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#555;font-size:20px;pointer-events:none}.progress{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:30;background:#000c;color:#fff;padding:10px 16px;border-radius:14px;display:none}</style></head><body><div id="stage"><img id="photo" alt="Фото"><div id="hint">Натисніть «Додати фото»<br>Потім збільшуйте та пересувайте двома пальцями</div></div><div class="progress" id="progress">Тримайте 10 с</div><div class="bar" id="bar"><label class="upload">➕ Фото<input id="file" type="file" accept="image/*"></label><button id="darker">🌙</button><button id="lighter">☀️</button><button id="fullscreen">⛶ Повний екран</button><button id="exitFullscreen" style="display:none">✕ Вийти</button><button id="lock">🔒 Блокувати</button></div><script>
const stage=document.querySelector('#stage'),img=document.querySelector('#photo'),file=document.querySelector('#file'),hint=document.querySelector('#hint'),lock=document.querySelector('#lock'),progress=document.querySelector('#progress'),fullscreenBtn=document.querySelector('#fullscreen'),exitFullscreenBtn=document.querySelector('#exitFullscreen');let bright=1,scale=1,x=0,y=0,locked=false,startDist=0,startScale=1,startX=0,startY=0,startMid=null,holdTimer=null,holdStart=0;
function draw(){img.style.filter=`brightness(${bright})`;img.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
file.onchange=e=>{let f=e.target.files[0];if(!f)return;img.src=URL.createObjectURL(f);img.style.display='block';hint.style.display='none';scale=1;x=y=0;bright=1;draw()};
document.querySelector('#lighter').onclick=()=>{bright=Math.min(2,bright+.15);draw()};document.querySelector('#darker').onclick=()=>{bright=Math.max(.25,bright-.15);draw()};
async function enterFullscreen(){
  try{
    const el=document.documentElement;
    if(el.requestFullscreen) await el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }catch(e){}
  updateFullscreenUI(true);
}
async function exitFullscreen(){
  try{
    if(document.fullscreenElement&&document.exitFullscreen) await document.exitFullscreen();
    else if(document.webkitFullscreenElement&&document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  updateFullscreenUI(false);
}
function updateFullscreenUI(force){
  const active=force!==undefined?force:!!(document.fullscreenElement||document.webkitFullscreenElement);
  fullscreenBtn.style.display=active?'none':'';
  exitFullscreenBtn.style.display=active?'':'none';
}
fullscreenBtn.addEventListener('click',enterFullscreen);
exitFullscreenBtn.addEventListener('click',exitFullscreen);
document.addEventListener('fullscreenchange',()=>updateFullscreenUI());
document.addEventListener('webkitfullscreenchange',()=>updateFullscreenUI());

function setLocked(v){locked=v;document.body.classList.toggle('locked-ui',v);lock.classList.toggle('locked',v);lock.textContent=v?'🔒 Утримуйте 10 с':'🔒 Блокувати';progress.style.display='none'}
lock.addEventListener('click',()=>{if(!locked)setLocked(true)});
function beginHold(e){if(!locked)return;e.preventDefault();holdStart=Date.now();progress.style.display='block';const tick=()=>{let left=Math.max(0,10-(Date.now()-holdStart)/1000);progress.textContent=`Тримайте ${left.toFixed(1)} с`;if(left<=0){setLocked(false);return}holdTimer=requestAnimationFrame(tick)};tick()}
function endHold(){if(holdTimer)cancelAnimationFrame(holdTimer);holdTimer=null;if(locked)progress.style.display='none'}lock.addEventListener('pointerdown',beginHold);lock.addEventListener('pointerup',endHold);lock.addEventListener('pointercancel',endHold);lock.addEventListener('pointerleave',endHold);
function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function mid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
stage.addEventListener('touchstart',e=>{if(locked){e.preventDefault();return}if(e.touches.length===2){startDist=dist(e.touches[0],e.touches[1]);startScale=scale;startMid=mid(e.touches[0],e.touches[1]);startX=x;startY=y}}, {passive:false});stage.addEventListener('touchmove',e=>{e.preventDefault();if(locked)return;if(e.touches.length===2&&startMid){let m=mid(e.touches[0],e.touches[1]);scale=Math.max(.2,Math.min(8,startScale*dist(e.touches[0],e.touches[1])/startDist));x=startX+(m.x-startMid.x);y=startY+(m.y-startMid.y);draw()}},{passive:false});stage.addEventListener('touchend',e=>{if(e.touches.length<2)startMid=null},{passive:false});
</script></body></html>
